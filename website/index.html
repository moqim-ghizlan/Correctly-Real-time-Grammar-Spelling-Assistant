    <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>

    <header class="site-header" id="top">
      <div class="wrap header-row">
        <a class="brand" href="#top" data-i18n-attr="aria-label:nav.home">
          <svg class="brand-logo" aria-hidden="true">
            <use href="#i-logo" />
          </svg>
          <span class="brand-name">Correctly</span>
        </a>

        <nav class="nav-desktop" data-i18n-attr="aria-label:nav.primary">
          <ul class="nav-list">
            <li><a href="#new" data-nav data-i18n="nav.new"></a></li>
            <li><a href="#actions" data-nav data-i18n="nav.actions"></a></li>
            <li><a href="#demo" data-nav data-i18n="nav.demo"></a></li>
            <li><a href="#privacy" data-nav data-i18n="nav.privacy"></a></li>
            <li><a href="#faq" data-nav data-i18n="nav.faq"></a></li>
          </ul>
        </nav>

        <div class="header-tools">
          <div
            class="seg"
            data-js-only
            role="group"
            data-i18n-attr="aria-label:lang.group"
          >
            <button
              type="button"
              class="seg-btn"
              data-lang="fr"
              lang="fr"
              aria-pressed="true"
              data-i18n-attr="title:lang.fr"
            >
              FR
            </button>
            <button
              type="button"
              class="seg-btn"
              data-lang="en"
              lang="en"
              aria-pressed="false"
              data-i18n-attr="title:lang.en"
            >
              EN
            </button>
          </div>
          <button
            type="button"
            class="icon-btn"
            data-js-only
            data-theme-toggle
            data-i18n-attr="aria-label:theme.system;title:theme.system"
          >
            <svg class="icon theme-icon theme-icon-system" aria-hidden="true">
              <use href="#i-system" />
            </svg>
            <svg class="icon theme-icon theme-icon-light" aria-hidden="true">
              <use href="#i-sun" />
            </svg>
            <svg class="icon theme-icon theme-icon-dark" aria-hidden="true">
              <use href="#i-moon" />
            </svg>
          </button>
          <a class="btn btn-primary btn-sm header-cta" href="#download">
            <svg class="icon icon-sm" aria-hidden="true">
              <use href="#i-download" />
            </svg>
            <span data-i18n="nav.download"></span>
          </a>
          <button
            type="button"
            class="icon-btn menu-btn"
            data-js-only
            aria-expanded="false"
            aria-controls="mobile-menu"
            data-i18n-attr="aria-label:nav.menuOpen"
          >
            <svg class="icon menu-icon-open" aria-hidden="true">
              <use href="#i-menu" />
            </svg>
            <svg class="icon menu-icon-close" aria-hidden="true">
              <use href="#i-close" />
            </svg>
          </button>
        </div>
      </div>

      <nav
        class="mobile-menu"
        id="mobile-menu"
        data-i18n-attr="aria-label:nav.primary"
      >
        <ul class="wrap mobile-list">
          <li><a href="#new" data-i18n="nav.new"></a></li>
          <li><a href="#actions" data-i18n="nav.actions"></a></li>
          <li><a href="#demo" data-i18n="nav.demo"></a></li>
          <li><a href="#privacy" data-i18n="nav.privacy"></a></li>
          <li><a href="#faq" data-i18n="nav.faq"></a></li>
          <li><a href="#download" data-i18n="nav.download"></a></li>
        </ul>
      </nav>
    </header>

    <main id="main" tabindex="-1">
      <!-- Hero -->
      <section class="hero" aria-labelledby="hero-title">
        <div class="wrap hero-grid">
          <div class="hero-copy">
            <h1 id="hero-title" class="hero-title">
              <span class="hero-line" data-i18n="hero.titleA"></span>
              <span class="hero-line" data-i18n="hero.titleB"></span>
            </h1>
            <p class="hero-lede" data-i18n="hero.lede"></p>
            <div class="hero-actions">
              <a
                class="btn btn-primary"
                href="#demo"
                data-i18n="hero.ctaDemo"
              ></a>
              <a class="btn btn-secondary" href="#download">
                <svg class="icon icon-sm" aria-hidden="true">
                  <use href="#i-download" />
                </svg>
                <span data-i18n="hero.ctaDownload"></span>
              </a>
              <a class="link-play" href="#video" data-film-open="0">
                <span class="link-play-disc"
                  ><svg aria-hidden="true"><use href="#i-play" /></svg
                ></span>
                <span data-i18n="hero.watch"></span>
              </a>
            </div>
            <p class="hero-note" data-i18n="hero.note"></p>
          </div>

          <figure class="hero-figure">
            <div class="mock" role="img" data-i18n-attr="aria-label:mock.alt">
              <div class="mock-page">
                <div class="mock-page-head">
                  <span class="mock-page-title" data-i18n="mock.page"></span>
                  <span class="mock-page-to" data-i18n="mock.to"></span>
                </div>
                <div class="mock-field">
                  <span class="mock-sel"
                    ><span data-i18n="mock.p1"></span
                    ><span data-i18n="mock.e1"></span
                    ><span data-i18n="mock.p2"></span
                    ><span data-i18n="mock.e2"></span
                    ><span data-i18n="mock.p3"></span
                    ><span data-i18n="mock.e3"></span
                    ><span data-i18n="mock.p4"></span
                  ></span>
                </div>
                <div class="mock-lines">
                  <span></span><span></span><span></span>
                </div>
              </div>
              <span class="mock-handle"
                ><svg aria-hidden="true"><use href="#i-logo" /></svg
              ></span>
              <div class="cw mock-window">
                <div class="cw-head">
                  <svg class="cw-logo" aria-hidden="true">
                    <use href="#i-logo" />
                  </svg>
                  <span class="cw-name">Correctly</span>
                  <span class="cw-head-icons">
                    <svg aria-hidden="true"><use href="#i-gear" /></svg>
                    <svg aria-hidden="true"><use href="#i-minus" /></svg>
                    <svg aria-hidden="true"><use href="#i-close" /></svg>
                  </span>
                </div>
                <div class="cw-tabs">
                  <span
                    class="cw-tab is-active"
                    data-i18n="act.correction.t"
                  ></span>
                  <span class="cw-tab" data-i18n="act.rewrite.t"></span>
                  <span class="cw-tab" data-i18n="act.translation.t"></span>
                  <span class="cw-tab" data-i18n="act.summary.t"></span>
                </div>
                <div class="cw-body">
                  <span class="cw-label" data-i18n="demo.corrected"></span>
                  <p class="proof mock-proof">
                    <span data-i18n="mock.p1"></span
                    ><span class="fix fix-1"
                      ><del data-i18n="mock.e1"></del
                      ><ins data-i18n="mock.c1"></ins></span
                    ><span data-i18n="mock.p2"></span
                    ><span class="fix fix-2"
                      ><del data-i18n="mock.e2"></del
                      ><ins data-i18n="mock.c2"></ins></span
                    ><span data-i18n="mock.p3"></span
                    ><span class="fix fix-3"
                      ><del data-i18n="mock.e3"></del
                      ><ins data-i18n="mock.c3"></ins></span
                    ><span data-i18n="mock.p4"></span>
                  </p>
                </div>
                <div class="cw-foot">
                  <span
                    class="cw-btn cw-btn-primary mock-apply"
                    data-i18n="demo.apply"
                  ></span>
                  <span class="cw-btn" data-i18n="demo.copy"></span>
                  <span class="cw-btn" data-i18n="demo.cancel"></span>
                </div>
              </div>
            </div>
            <figcaption
              class="hero-caption"
              data-i18n="mock.caption"
            ></figcaption>
          </figure>
        </div>
      </section>

      <!-- Benefits -->
      <section class="benefits" aria-labelledby="benefits-title">
        <div class="wrap">
          <h2
            id="benefits-title"
            class="sr-only"
            data-i18n="benefits.title"
          ></h2>
          <ul class="benefit-list">
            <li class="benefit">
              <svg class="icon benefit-icon" aria-hidden="true">
                <use href="#i-click" />
              </svg>
              <h3 class="benefit-title" data-i18n="benefit.1.t"></h3>
              <p class="benefit-text" data-i18n="benefit.1.d"></p>
            </li>
            <li class="benefit">
              <svg class="icon benefit-icon" aria-hidden="true">
                <use href="#i-eye" />
              </svg>
              <h3 class="benefit-title" data-i18n="benefit.2.t"></h3>
              <p class="benefit-text" data-i18n="benefit.2.d"></p>
            </li>
            <li class="benefit">
              <svg class="icon benefit-icon" aria-hidden="true">
                <use href="#i-key" />
              </svg>
              <h3 class="benefit-title" data-i18n="benefit.3.t"></h3>
              <p class="benefit-text" data-i18n="benefit.3.d"></p>
            </li>
            <li class="benefit">
              <svg class="icon benefit-icon" aria-hidden="true">
                <use href="#i-keyboard" />
              </svg>
              <h3 class="benefit-title" data-i18n="benefit.4.t"></h3>
              <p class="benefit-text" data-i18n="benefit.4.d"></p>
            </li>
          </ul>
        </div>
      </section>

      <!-- What's new (5.14): a short presentation of sync; a dedicated
           page will come later. -->
      <section class="section" id="new" aria-labelledby="new-title">
        <div class="wrap new-grid">
          <header class="new-head">
            <p class="release-tag">
              <span data-i18n="new.badge"></span>
              <span class="release-num">5.14</span>
            </p>
            <h2 id="new-title" class="section-title" data-i18n="new.title"></h2>
            <p class="section-lede" data-i18n="new.lede"></p>
            <p class="new-soon" data-i18n="new.soon"></p>
          </header>
          <ul class="new-points">
            <li class="new-point">
              <svg class="icon new-icon" aria-hidden="true">
                <use href="#i-sync" />
              </svg>
              <div>
                <h3 class="new-point-title" data-i18n="new.1.t"></h3>
                <p class="new-point-text" data-i18n="new.1.d"></p>
              </div>
            </li>
            <li class="new-point">
              <svg class="icon new-icon" aria-hidden="true">
                <use href="#i-key" />
              </svg>
              <div>
                <h3 class="new-point-title" data-i18n="new.2.t"></h3>
                <p class="new-point-text" data-i18n="new.2.d"></p>
              </div>
            </li>
            <li class="new-point">
              <svg class="icon new-icon" aria-hidden="true">
                <use href="#i-check" />
              </svg>
              <div>
                <h3 class="new-point-title" data-i18n="new.3.t"></h3>
                <p class="new-point-text" data-i18n="new.3.d"></p>
              </div>
            </li>
          </ul>
        </div>
      </section>

      <!-- Film: a silent teaser loop on the page; the full film (music)
           opens in a custom player only on request. -->
      <section
        class="section section-film"
        id="video"
        aria-labelledby="video-title"
      >
        <div class="wrap">
          <header class="section-head">
            <h2
              id="video-title"
              class="section-title"
              data-i18n="video.title"
            ></h2>
            <p class="section-lede" data-i18n="video.lede"></p>
          </header>
          <div class="film-stage">
            <video
              class="film-teaser"
              muted
              loop
              playsinline
              preload="none"
              poster="assets/video/teaser-poster.jpg"
              width="1280"
              height="720"
              aria-hidden="true"
              tabindex="-1"
            >
              <source src="assets/video/teaser.mp4" type="video/mp4" />
            </video>
            <div class="film-cta">
              <button
                type="button"
                class="film-open"
                data-js-only
                data-film-open="0"
              >
                <span class="film-open-disc"
                  ><svg aria-hidden="true"><use href="#i-play" /></svg
                ></span>
                <span class="film-open-label">
                  <span data-i18n="film.watch"></span>
                  <span class="film-open-meta" data-i18n="film.meta"></span>
                </span>
              </button>
              <noscript>
                <a class="film-open" href="assets/video/correctly-1080.mp4">
                  <span class="film-open-disc"
                    ><svg aria-hidden="true"><use href="#i-play" /></svg
                  ></span>
                  <span class="film-open-label"
                    ><span data-i18n="film.mp4"></span
                  ></span>
                </a>
              </noscript>
            </div>
          </div>
          <p class="film-note" data-i18n="video.caption"></p>
          <h3 class="sr-only" data-i18n="film.chapters"></h3>
          <ol class="film-chips" data-js-only>
            <li>
              <button type="button" class="film-chip" data-chapter="0">
                <span class="chapter-time">0:00</span>
                <span data-i18n="film.ch.intro"></span>
              </button>
            </li>
            <li>
              <button type="button" class="film-chip" data-chapter="12.8">
                <span class="chapter-time">0:12</span>
                <span data-i18n="film.ch.correction"></span>
              </button>
            </li>
            <li>
              <button type="button" class="film-chip" data-chapter="19.2">
                <span class="chapter-time">0:19</span>
                <span data-i18n="film.ch.rewrite"></span>
              </button>
            </li>
            <li>
              <button type="button" class="film-chip" data-chapter="24.8">
                <span class="chapter-time">0:24</span>
                <span data-i18n="film.ch.translation"></span>
              </button>
            </li>
            <li>
              <button type="button" class="film-chip" data-chapter="30.4">
                <span class="chapter-time">0:30</span>
                <span data-i18n="film.ch.summary"></span>
              </button>
            </li>
            <li>

          </button>
        </div>
        <div class="fp-screen">
          <video
            id="film-video"
            preload="none"
            playsinline
            poster="assets/video/poster.jpg"
            width="1920"
            height="1080"
          >
            <source
              src="assets/video/correctly-720.mp4"
              type="video/mp4"
              media="(max-width: 900px)"
            />
            <source src="assets/video/correctly-1080.mp4" type="video/mp4" />
          </video>
          <button
            type="button"
            class="fp-big"
            data-i18n-attr="aria-label:film.play"
          >
            <svg aria-hidden="true"><use href="#i-play" /></svg>
          </button>
        </div>
        <div class="fp-controls">
          <button
            type="button"
            class="fp-icon fp-toggle"
            autofocus
            data-i18n-attr="aria-label:film.play;title:film.play"
          >
            <svg class="fp-ico-play" aria-hidden="true">
              <use href="#i-play" />
            </svg>
            <svg class="fp-ico-pause" aria-hidden="true">
              <use href="#i-pause" />
            </svg>
          </button>
          <span class="fp-time"><span class="fp-now">0:00</span> / 0:58</span>
          <div
            class="fp-bar"
            role="slider"
            tabindex="0"
            aria-valuemin="0"

            aria-valuetext="0:00"

            <span class="fp-tick" style="left: 52.78%"></span>

            <span class="fp-tick" style="left: 83.33%"></span>
            <span class="fp-knob"></span>
          </div>
          <button
            type="button"
            class="fp-icon fp-mute"
            data-i18n-attr="aria-label:film.mute;title:film.mute"
          >
            <svg class="fp-ico-sound" aria-hidden="true">
              <use href="#i-sound" />
            </svg>
            <svg class="fp-ico-muted" aria-hidden="true">
              <use href="#i-muted" />
            </svg>
          </button>
          <button
            type="button"
            class="fp-icon fp-full"
            data-i18n-attr="aria-label:film.full;title:film.full"
          >
            <svg aria-hidden="true"><use href="#i-full" /></svg>
          </button>
        </div>
        <ol class="fp-chapters" data-i18n-attr="aria-label:film.chapters">
