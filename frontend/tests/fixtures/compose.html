<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Correctly — fenêtre de rédaction</title>
    <style>
      body {
        margin: 20px;
        overflow: hidden;
        font:
          16px Arial,
          sans-serif;
      }
      button {
        padding: 8px 12px;
      }
      #mount {
        visibility: hidden;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      #compose {
        visibility: visible;
        position: fixed;
        top: 70px;
        left: 40px;
        width: min(650px, calc(100vw - 80px));
        background: white;
        border: 1px solid #bbb;
        border-radius: 8px;
        box-shadow: 0 4px 20px #0002;
      }
      header,
      footer {
        padding: 12px 20px;
        background: #f3f5f8;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 15px 20px;
        font: inherit;
        border: 0;
        border-bottom: 1px solid #ddd;
      }
      #scroll-area {
        overflow: auto;
        height: min(350px, calc(100vh - 240px));
      }
      #editor {
        box-sizing: border-box;
        min-height: 100%;
        padding: 20px;
        outline: none;
        line-height: 1.5;
      }
      #compose[data-minimized] input,
      #compose[data-minimized] #scroll-area,
      #compose[data-minimized] footer {
        display: none;
      }
    </style>
  </head>
  <body>
    <button id="open" type="button">Nouveau message de test</button>
    <div id="mount"></div>
    <template id="compose-template">
      <section id="compose" role="dialog" aria-label="Rédaction de test">
        <header>
          <span>Rédaction de test</span>
          <div>
            <button id="minimize" type="button">Réduire / ouvrir</button
            ><button id="close" type="button">Fermer</button>
          </div>
        </header>
        <input name="subjectbox" aria-label="Objet" placeholder="Objet" />
        <div id="scroll-area">
          <div
            id="editor"
            contenteditable="true"
            role="textbox"
            aria-label="Corps du message"
            g_editable="true"
          >
            <div>je sui <strong>ici</strong>.</div>
            <div><br /></div>
            <div>Deuxième paragraphe conservé.</div>
          </div>
        </div>
        <footer>Page de test locale : aucun message n’est envoyé.</footer>
      </section>
    </template>
    <script>
      document.querySelector('#open').addEventListener('click', () => {
        if (document.querySelector('#compose')) return;
        document
          .querySelector('#mount')
          .append(
            document.querySelector('#compose-template').content.cloneNode(true),
          );
        document
          .querySelector('#minimize')
          .addEventListener('click', () =>
            document
              .querySelector('#compose')
              .toggleAttribute('data-minimized'),
          );
        document
          .querySelector('#close')
          .addEventListener('click', () =>
            document.querySelector('#compose').remove(),
          );
        document.querySelector('#editor').focus();
      });
    </script>
  </body>
</html>
