<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Correctly</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body class="popup">
    <header>
      <span class="mark" aria-hidden="true">C</span>
      <div>
        <h1>Correctly</h1>
        <p>Vos mots, corrigés localement.</p>
      </div>
    </header>
    <fieldset id="controls" disabled>
      <label class="row" for="enabled"
        ><span>Correction activée</span><input type="checkbox" id="enabled"
      /></label>
      <label class="row" for="language"
        ><span>Langue</span
        ><select id="language">
          <option value="auto">Auto</option>
          <option value="fr">Français</option>
          <option value="en">Anglais</option>
        </select></label
      >
      <label class="row" for="site"
        ><span id="site-label">Désactiver sur ce site</span
        ><input type="checkbox" id="site" disabled
      /></label>
    </fieldset>
    <hr />
    <div class="status" id="server" aria-live="polite">
      Vérification de LanguageTool…
    </div>
    <div class="actions">
      <button type="button" id="retry">Vérifier le moteur</button
      ><button type="button" id="options">Paramètres</button>
    </div>
    <p class="hint">
      Le texte est analysé par LanguageTool sur votre ordinateur.
    </p>
    <p id="message" role="status"></p>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
