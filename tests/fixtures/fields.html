<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Correctly — tests manuels</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
        max-width: 760px;
      }
      label {
        display: block;
        margin: 25px 0;
      }
      input,
      textarea,
      [contenteditable] {
        display: block;
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        font: 18px/1.6 Georgia;
        border: 1px solid #aaa;
        border-radius: 5px;
      }
      textarea {
        height: 140px;
      }
      button {
        padding: 8px;
        margin: 6px;
      }
      #scroll-area {
        height: 150px;
        overflow: auto;
        border: 1px solid #ccc;
      }
      #scroll-area textarea {
        margin-top: 100px;
        margin-bottom: 100px;
      }
    </style>
  </head>
  <body>
    <h1>Page de test Correctly</h1>
    <p>
      Les résultats dépendent du moteur LanguageTool local. Attendez 400 ms
      après la frappe.
    </p>
    <label
      >Textarea<textarea>
je sui content
Il sont parti hier.
je vais a paris demain</textarea>
    </label>
    <label>Input texte<input type="text" value="je sui ici" /></label>
    <label>Recherche<input type="search" value="I has a car." /></label>
    <label
      >Contenteditable
      <div contenteditable="true" role="textbox">
        <p>je <strong>sui</strong> content</p>
        <p>She go to school.</p>
      </div></label
    >
    <label>Unicode<textarea>😊 🇫🇷 je sui ici. é è à ç œ</textarea></label>
    <label
      >Texte HTML littéral<textarea>
&lt;img src=x onerror=alert(1)&gt;&lt;script&gt;alert(1)&lt;/script&gt; je sui ici</textarea>
    </label>
    <label
      >Mot de passe (aucune correction)<input
        type="password"
        value="je sui ici"
    /></label>
    <label
      >Email (aucune correction)<input type="email" value="exemple@example.com"
    /></label>
    <label>Nombre (aucune correction)<input type="number" value="12" /></label>
    <label>Lecture seule<textarea readonly>je sui ici</textarea></label>
    <fieldset disabled>
      <label>Fieldset désactivé<textarea>je sui ici</textarea></label>
    </fieldset>
    <div id="scroll-area">
      <textarea>je sui ici dans un conteneur scrollable</textarea>
    </div>
    <button id="add" type="button">Ajouter un champ</button
    ><button id="remove" type="button">Supprimer le dernier champ</button>
    <button id="long" type="button">
      Ajouter un texte de plus de 5 000 caractères
    </button>
    <div id="dynamic"></div>
    <script>
      document.querySelector('#add').addEventListener('click', () => {
        const field = document.createElement('textarea');
        field.value = 'je sui ici';
        document.querySelector('#dynamic').append(field);
      });
      document
        .querySelector('#remove')
        .addEventListener('click', () =>
          document.querySelector('#dynamic').lastElementChild?.remove(),
        );
      document.querySelector('#long').addEventListener('click', () => {
        const field = document.createElement('textarea');
        field.value = 'je sui ici '.repeat(500);
        document.querySelector('#dynamic').append(field);
      });
    </script>
  </body>
</html>
